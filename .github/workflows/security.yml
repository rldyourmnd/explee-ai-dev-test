# Public OSS security suite, the free set that a public repository gets at no
# cost: CodeQL, native secret scanning, actionlint and zizmor with SARIF.
#
# Composed from NDDev-it-com/ci-workflows rather than hand-rolled, and pinned to
# a full commit SHA. A tag or branch reference would let the behaviour of these
# jobs change under us without a commit here, which is the same class of defect
# as the unpinned ruff that made a green local run and a red CI run describe the
# same tree.
#
# `runner: ubuntu-latest` is not redundant, and this is the subtle part. On a
# public repository `pull_request` executes untrusted fork code, and several of
# these reusables default `runner` to a private self-hosted label. That default
# lives in the pinned commit, so omitting the input would let a routine pin bump
# silently move fork PRs onto private infrastructure. Public callers name their
# runner.
#
# ci.yml is deliberately untouched: it holds the correctness gates: pinned
# pytest, ruff and pyright, plus the repository consistency check, and this file
# only adds security scanning alongside them.
#
# FAILING FOR AN EXTERNAL REASON, CAUSE CONFIRMED 2026-08-24. Runs end in
# startup_failure: zero jobs, no logs, and the run named by this file path
# rather than by `name:`. Nothing in this file was ever wrong.
#
# Cause: the callee NDDev-it-com/ci-workflows has ACTIONS DISABLED.
#   gh api repos/NDDev-it-com/ci-workflows/actions/permissions -> {"enabled": false}
# Archiving a repository disables its Actions, and UN-ARCHIVING DOES NOT
# RE-ENABLE THEM. The owner un-archived it (archived=false, verified) and both
# workflows failed again identically, because the second condition was still in
# force. A repository with Actions disabled cannot serve a reusable workflow.
# Two distinct causes wearing one signature, and the second was invisible until
# the first was cleared.
#
# Fix is one setting on the callee, and it is the owner's to make: enabling
# Actions on another org's repository is not a unilateral change. Nothing in
# this file is wrong. Ruled out at the same time: the pin still declares
# `on: workflow_call`, all five called files resolve at it, and it remains
# reachable from the callee default branch (behind 97, ahead 0).
#
# To retry once Actions are back: `gh workflow run security.yml` (both files
# keep `workflow_dispatch` for exactly this). GitHub refuses to retry a startup
# failure, so without dispatch you would need a synthetic commit.
#
# Kept because the hunt was expensive and the signature is worth recognising:
# instant failure with NO LOGS means the platform refused to start the
# workflow, so the cause is outside the file. Two hypotheses were tested and
# both were wrong - permissions delegation (disproved by dependency-review.yml
# doing empty-then-elevate at the same pin) and unresolvable pins (the pins in
# question were actions/checkout and astral-sh/setup-uv, from other
# repositories entirely). What settled it was a re-run: the same run id, same
# commit, same event went success -> startup_failure with zero repository
# changes between attempts, which isolates the variable to something external
# and which no amount of reading this file could have found.
name: security
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  # See scorecard.yml: a startup failure cannot be retried, so a manual trigger
  # is the difference between re-testing a fix and fabricating a commit for it.
  workflow_dispatch:
permissions: {}
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  codeql:
    permissions: { actions: read, contents: read, security-events: write }
    uses: NDDev-it-com/ci-workflows/.github/workflows/public-codeql.yml@00546f1c601a106d560d92e316f332891ac6f840
    with:
      runner: ubuntu-latest
      languages: '["python","actions"]'
  secret-scan:
    permissions: { contents: read }
    uses: NDDev-it-com/ci-workflows/.github/workflows/secret-scan.yml@00546f1c601a106d560d92e316f332891ac6f840
    with:
      runner: ubuntu-latest
  actionlint:
    permissions: { contents: read }
    uses: NDDev-it-com/ci-workflows/.github/workflows/actionlint.yml@00546f1c601a106d560d92e316f332891ac6f840
    with:
      runner: ubuntu-latest
  zizmor:
    permissions: { actions: read, contents: read, security-events: write }
    uses: NDDev-it-com/ci-workflows/.github/workflows/zizmor-sarif.yml@00546f1c601a106d560d92e316f332891ac6f840
    with:
      runner: ubuntu-latest
