name: CI

# Runs on GitHub-hosted ubuntu-latest runners, which are free for this
# repository. Deliberately independent of the publication decision: Actions runs
# on private repositories too, so CI does not wait on the repo becoming public.
#
# Why this workflow exists at all: the external review's central point is that a
# reviewer who cannot run anything must treat every machine-level claim here as
# an agent assertion. A CI run attached to a commit is the one piece of evidence
# that a grader can verify without trusting us or running anything themselves.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Record tool versions
        run: |
          uv --version
          python3 -V
          uv run --with ruff ruff --version
          echo "commit: ${GITHUB_SHA}"

      - name: pytest
        run: uv run --with pytest pytest tests/ -q

      - name: ruff
        run: uv run --with ruff ruff check .

      # Non-blocking on purpose, and this is a declared state rather than a
      # hidden one. Baseline at 8111af1 is 18 pyright errors: most are the test
      # files' importlib dynamic module loading (ModuleSpec | None), plus one
      # real defect in tools/export_trace.py flagged by the review and owned by
      # surface:8. Making it blocking today would paint CI red without telling
      # anyone anything new; leaving it out entirely would hide a known problem.
      # Flip continue-on-error to false once the count reaches 0 — the count is
      # tracked as row X.5 in docs/ACCEPTANCE.md.
      - name: pyright (reporting only, see docs/ACCEPTANCE.md X.5)
        continue-on-error: true
        run: uv run --with pyright --with pytest pyright
