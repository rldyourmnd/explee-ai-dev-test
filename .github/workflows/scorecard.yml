# OSSF Scorecard — push-to-default and a weekly schedule ONLY.
#
# Kept separate from security.yml on purpose: the Scorecard action supports only
# `push` and `schedule` on the default branch, and `pull_request` is
# experimental. Folding it into the pull_request-triggered suite would produce a
# job that fails for reasons unrelated to the change under review.
name: scorecard
on:
  push: { branches: [main] }
  schedule:
    - cron: "31 2 * * 1"
# The union of what the jobs below need. An empty map here grants the
# GITHUB_TOKEN nothing, and a job cannot expand what the workflow never held -
# so `id-token: write` at job level was asking for something undelegatable, and
# the run failed at startup with no jobs and no logs. Jobs still narrow from
# this; the workflow-level set is the ceiling, not the grant.
permissions:
  id-token: write
  contents: read
  actions: read
jobs:
  scorecard:
    permissions:
      id-token: write
      contents: read
      actions: read
    uses: NDDev-it-com/ci-workflows/.github/workflows/public-scorecard-json.yml@00546f1c601a106d560d92e316f332891ac6f840
    with:
      runner: ubuntu-latest
