# OSSF Scorecard — push-to-default and a weekly schedule ONLY.
#
# Kept separate from security.yml on purpose: the Scorecard action supports only
# `push` and `schedule` on the default branch, and `pull_request` is
# experimental. Folding it into the pull_request-triggered suite would produce a
# job that fails for reasons unrelated to the change under review.
#
# WAS FAILING FOR AN EXTERNAL REASON, RESOLVED 2026-08-24. Runs ended in
# startup_failure: zero jobs, no logs, and the run named by this file path
# rather than by `name:`. Nothing in this file was ever wrong.
#
# Cause: NDDev-it-com/ci-workflows was ARCHIVED, and GitHub will not serve a
# reusable workflow from an archived repository. The owner un-archived it.
#
# Kept because the hunt was expensive and the signature is worth recognising:
# instant failure with NO LOGS means the platform refused to start the
# workflow, so the cause is outside the file. Two hypotheses were tested and
# both were wrong - permissions delegation (disproved by dependency-review.yml
# doing empty-then-elevate at the same pin) and unresolvable pins (the pins in
# question were actions/checkout and astral-sh/setup-uv, from other
# repositories entirely). What settled it was a re-run: the same run id, same
# commit, same event went success -> startup_failure with zero repository
# changes between attempts, which isolates the variable to something external
# and which no amount of reading this file could have found.
name: scorecard
on:
  push: { branches: [main] }
  schedule:
    - cron: "31 2 * * 1"
  # Manual trigger so a re-run never needs a synthetic commit. GitHub refuses to
  # retry a run that failed at startup ("This workflow run cannot be retried"),
  # so without this the only way to re-test was to push something. That is how a
  # diagnosis ends up costing commits it should not.
  workflow_dispatch:
permissions: {}
jobs:
  scorecard:
    permissions:
      id-token: write
      contents: read
      actions: read
    uses: NDDev-it-com/ci-workflows/.github/workflows/public-scorecard-json.yml@00546f1c601a106d560d92e316f332891ac6f840
    with:
      runner: ubuntu-latest
